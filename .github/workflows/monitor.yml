name: Line Watch monitor

on:
  schedule:
    # ogni 10 minuti. GitHub Actions non garantisce la precisione al minuto sui
    # cron gratuiti (puo' ritardare qualche minuto nei momenti di traffico alto
    # su GitHub): "continuo" qui significa "controllo periodico", non realtime.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # permette di far partire un controllo manuale dalla tab "Actions"

permissions:
  contents: write  # serve per poter salvare (commit) lo stato aggiornato nel repo

concurrency:
  group: line-watch-monitor
  cancel-in-progress: false  # non interrompere un giro a meta' se ne parte un altro

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Esegui il controllo
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m monitor.run

      - name: Salva lo stato aggiornato nel repository
        run: |
          git config user.name "line-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/alerts_log.json docs/data.json
          git diff --quiet --cached || git commit -m "Aggiorna dati Line Watch [skip ci]"
          git push
